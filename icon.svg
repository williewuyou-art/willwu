    <path d="M-78 -45 L-35 -20" stroke="#09090b" stroke-width="8" />
  </g>
  
  <!-- 文字標記 -->
  <text x="256" y="470" font-family="monospace" font-size="32" fill="#71717a" text-anchor="middle" letter-spacing="4">ENG.CAM</text>
